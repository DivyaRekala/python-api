# version: '3.8'

services:
  flask:
    build:
      context: .
    ports:
      - "5000:5000"
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://flask_user:flask_password@db:5432/flask_db
    networks:
      my_network:
        ipv4_address: 172.28.0.2
    restart: always
    volumes:
    - .:/workspace

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - flask
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: flask_db
      POSTGRES_USER: flask_user
      POSTGRES_PASSWORD: flask_password
    ports:
      - "5432:5432"
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql  # Initialize DB on startup
    restart: always

networks:
  my_network:
    driver: bridge
    ipam:
      config:
        - subnet: "172.28.0.0/16"

volumes:
  postgres_data: