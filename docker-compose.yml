version: '3.8'

services:
  flask:
    build:
      context: .
    ports:
      - "5000:5000"

    networks:
      my_network:
        ipv4_address: 172.28.0.2
    restart: always
    volumes:
    - .:/workspace

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - flask

networks:
  my_network:
    driver: bridge
    ipam:
      config:
        - subnet: "172.28.0.0/16"